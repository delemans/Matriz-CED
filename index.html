<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PG-TH-01 GESTIÓN DE FORMACIÓN | EL DORADO</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/tPs6nZjm/Nuevo-logo-El-Dorado.png">
    
    <style>
        /* Eliminar márgenes y desplazamientos */
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #f4f6f9; /* Color de carga suave */
            font-family: 'Poppins', sans-serif;
        }

        /* Contenedor del Iframe para que ocupe todo el espacio */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Pantalla de carga (opcional mientras conecta con GAS) */
        #loading {
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            z-index: -1; 
        }
    </style>
</head>
<body>

    <div id="loading">
        <p>Cargando Sistema de Gestión...</p>
    </div>

    <iframe 
        src="https://script.google.com/macros/s/AKfycbwbsHg1V0volRmx6LeTINmEVcr9TOtIWrgK7ZXJdTPCZxtCzvXBF0khv-pcGB04exsVOA/exec" 
        allow="fullscreen; camera; microphone; geolocation"
        title="Gestión de Formación">
    </iframe>

</body>
</html>
